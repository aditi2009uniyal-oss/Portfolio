<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfectly Sweet | Order</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Baloo 2', cursive;
      background-color: #fff5f8;
      background-image: url('menu.png');
      background-repeat: no-repeat;
      background-size: 1300px;
      background-position: center;
    }

    .overlay {
      background-color: rgba(255, 245, 250, 0.88);
      min-height: 100vh;
      padding-top: 80px;
      padding-bottom: 60px;
    }

    /* Navbar */
    .navbar {
      background-color: #ffd6e0;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.8rem;
      color: #ff6699 !important;
    }
    .nav-link {
      color: #8c5a63 !important;
      font-weight: 600;
    }
    .nav-link:hover {
      color: #ff6699 !important;
    }

    /* Form Card */
    .order-card {
      background-color: #fff;
      border: none;
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 6px 16px rgba(255, 182, 193, 0.4);
      max-width: 600px;
      margin: 0 auto;
      transition: transform 0.3s ease;
    }
    .order-card:hover {
      transform: scale(1.02);
    }

    .form-label {
      color: #ff6699;
      font-weight: 600;
    }

    .btn-order {
      background-color: #ff6699;
      color: white;
      font-weight: 600;
      border-radius: 15px;
      padding: 10px 20px;
      transition: background-color 0.3s ease;
    }

    .btn-order:hover {
      background-color: #ff8db3;
    }

    h2 {
      color: #ff6699;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }

    .thank-you {
      text-align: center;
      display: none;
      font-size: 1.2rem;
      color: #8c5a63;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Perfectly Sweet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Order Form -->
  <div class="overlay">
    <div class="container">
      <div class="order-card">
        <h2>Place Your Order 💖</h2>
        <form id="orderForm">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="Enter your number" required>
          </div>

          <div class="mb-3">
            <label for="item" class="form-label">Select Item</label>
            <select id="item" class="form-select" required>
              <option value="">-- Choose an item --</option>
              <option>Cupcake - Vanilla Dream</option>
              <option>Cupcake - Choco Bliss</option>
              <option>Cookies - Butter Bliss</option>
              <option>Pastry - Strawberry</option>
              <option>Drink - Hot Chocolate</option>
              <option>Drink - Berry Milkshake</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" id="quantity" class="form-control" placeholder="Enter quantity" min="1" required>
          </div>

          <div class="mb-3">
            <label for="notes" class="form-label">Special Instructions</label>
            <textarea id="notes" class="form-control" rows="3" placeholder="Any special requests?"></textarea>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-order">Place Order</button>
          </div>
        </form>

        <p id="thankYou" class="thank-you mt-4">🎉 Thank you for your order! We'll contact you soon. 💌</p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Small JS for Fake Submit -->
  <script>
    document.getElementById("orderForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("orderForm").reset();
      document.getElementById("thankYou").style.display = "block";
      setTimeout(() => {
        document.getElementById("thankYou").style.display = "none";
      }, 4000);
    });
  </script>

</body>
</html>
