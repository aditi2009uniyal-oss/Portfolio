<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfectly Sweet | Home</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Baloo 2', cursive;
      background-color: #ffe6ef;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      background-color: #ffd6e0;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.8rem;
      color: #ff6699 !important;
    }
    .nav-link {
      color: #8c5a63 !important;
      font-weight: 600;
    }
    .nav-link:hover {
      color: #ff6699 !important;
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 100vh;
      text-align: center;
      padding: 100px 20px;
      background: url('Background.png') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .hero-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 245, 250, 0.7);
      z-index: 1;
    }
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero h1 {
      font-size: 4rem;
      color: #ff6699;
      text-shadow: 1px 1px #fff;
    }
    .hero p {
      color: #7b4b52;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .btn-sweet {
      background-color: #ffb6c1;
      border: none;
      border-radius: 30px;
      padding: 12px 30px;
      color: #fff;
      font-weight: 600;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255,182,193,0.5);
    }
    .btn-sweet:hover {
      background-color: #ff6699;
      transform: scale(1.05);
    }

    .btn-order {
      background-color: #ff99cc;
      border: none;
      border-radius: 30px;
      padding: 12px 30px;
      color: #fff;
      font-weight: 600;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255,153,204,0.5);
    }
    .btn-order:hover {
      background-color: #ff6699;
      transform: scale(1.05);

/* Popup Logo Styling */
.logo-wrapper {
  width: 180px;
  height: 180px;
  border-radius: 40%;
  overflow: hidden;
  border: 4px solid #ffb6c1;
  box-shadow: 0 4px 15px rgba(255,182,193,0.5);
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Popup Animation */
.modal-content {
  box-shadow: 0 8px 20px rgba(255, 182, 193, 0.5);
  animation: popIn 0.6s ease;
}
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

    }
  </style>
</head>
<body>
<!-- Logo Popup Modal -->
<div class="modal fade" id="logoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4" 
         style="border-radius: 25px; background-color: #fff5f8; border: 3px solid #ffb6c1;">
      <div class="d-flex flex-column align-items-center">
        <div class="logo-wrapper mb-3">
          <img src="logo.png" alt="Perfectly Sweet Logo" 
               class="img-fluid logo-img">
        </div>
        <h2 style="color:#ff6699; font-family:'Baloo 2', cursive; font-weight:700;">
          Welcome to Perfectly Sweet!
        </h2>
        <button type="button" class="btn btn-sweet mt-3" data-bs-dismiss="modal">
          Enter Site 🥨
        </button>
      </div>
    </div>
  </div>
</div>



  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="#">Perfectly Sweet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="Index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Perfectly Sweet</h1>
      <p>Where Every Bite Feels Like Love 🍰</p>
      <div class="d-flex justify-content-center gap-3 flex-wrap">
        <a href="menu.html" class="btn btn-sweet">View Menu</a>
        <a href="order.html" class="btn btn-order">Place an Order</a>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.addEventListener('load', function() {
    const logoModal = new bootstrap.Modal(document.getElementById('logoModal'));
    logoModal.show();
  });
</script>


</body>
</html>
