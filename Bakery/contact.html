<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfectly Sweet | Contact</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Baloo 2', cursive;
      background-color: #fff5f8;
      background-image: url('menu.png');
      background-repeat: no-repeat;
      background-position: center;
      background-size: 1300px;
    }

    .overlay {
      background-color: rgba(255, 245, 250, 0.88);
      min-height: 100vh;
      padding-top: 80px;
      padding-bottom: 60px;
    }

    /* Navbar */
    .navbar {
      background-color: #ffd6e0;
    }
    .navbar-brand {
      font-weight: 700;
      font-size: 1.8rem;
      color: #ff6699 !important;
    }
    .nav-link {
      color: #8c5a63 !important;
      font-weight: 600;
    }
    .nav-link:hover {
      color: #ff6699 !important;
    }

    /* Contact Card */
    .contact-card {
      background-color: #fff;
      border-radius: 25px;
      padding: 40px;
      box-shadow: 0 6px 16px rgba(255, 182, 193, 0.4);
      max-width: 700px;
      margin: 0 auto;
      text-align: center;
    }

    h2 {
      color: #ff6699;
      font-size: 2.5rem;
      margin-bottom: 25px;
    }

    .form-label {
      color: #ff6699;
      font-weight: 600;
    }

    .btn-send {
      background-color: #ff6699;
      color: white;
      border-radius: 15px;
      padding: 10px 20px;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .btn-send:hover {
      background-color: #ff8db3;
    }

    .contact-info {
      margin-top: 40px;
      color: #8c5a63;
      font-size: 1.1rem;
    }

    .contact-info i {
      color: #ff6699;
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">Perfectly Sweet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Form -->
  <div class="overlay">
    <div class="container">
      <div class="contact-card">
        <h2>Get in Touch 💌</h2>

        <form id="contactForm">
          <div class="mb-3">
            <label for="name" class="form-label">Your Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="4" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit" class="btn btn-send">Send Message</button>
        </form>

        <div class="contact-info mt-5">
          <p><i class="bi bi-telephone-fill"></i> +91 98765 43210</p>
          <p><i class="bi bi-envelope-fill"></i> perfectlysweet@gmail.com</p>
          <p><i class="bi bi-geo-alt-fill"></i> Kasturba Pitampura, New Delhi</p>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("contactForm").addEventListener("submit", function(e){
      e.preventDefault();
      alert("Thank you for reaching out! 💖 We’ll get back to you soon.");
      this.reset();
    });
  </script>
</body>
</html>
