<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Indian Art</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- SweetAlert JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #fff8f0; color: #333; }
    .section-title { color: #d35400; margin-bottom: 20px; }
    .container { max-width: 600px; }
  </style>
</head>
<body>

  <section class="container my-5">
    <h2 class="section-title">Contact Us</h2>
    <p>Fill out the form below and we’ll get back to you soon!</p>

    <!-- Contact Form -->
    <form id="contactForm">
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your Name" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Your Email" required>
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" rows="5" placeholder="Your Message" required></textarea>
      </div>
      <button type="submit" class="btn btn-warning text-white">Send Message</button>
    </form>

    <p class="mt-3"><a href="index.html">Back to Home</a></p>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert Form Submission Script -->
  <script>
    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e) {
      e.preventDefault(); // prevent actual submission
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if(name && email && message) {
        Swal.fire({
          title: 'Thank you!',
          text: 'Your message has been sent successfully.',
          icon: 'success',
          confirmButtonText: 'OK'
        });
        form.reset();
      } else {
        Swal.fire({
          title: 'Oops!',
          text: 'Please fill in all fields.',
          icon: 'error',
          confirmButtonText: 'OK'
        });
      }
    });
  </script>

</body>
</html>
