<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aditi Digital Playground | Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: url("menu.png") no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .overlay {
      min-height: 100vh;
      padding: 120px 20px 60px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(4px);
    }

    /* ===== NAVBAR (Same as Landing Page) ===== */
    .navbar {
      background: linear-gradient(90deg, rgb(236, 125, 202), #ea2fff);
      backdrop-filter: blur(10px);
      color: white;
      padding: 0.8rem 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .navbar-brand {
      color: white !important;
      font-weight: 700;
    }

    /* ===== BURGER BUTTON ===== */
    .offcanvas-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1051;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .offcanvas-btn span {
      width: 28px;
      height: 3px;
      background: white;
      border-radius: 3px;
      transition: 0.4s ease;
    }
    .offcanvas-btn.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .offcanvas-btn.active span:nth-child(2) {
      opacity: 0;
    }
    .offcanvas-btn.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* ===== OFFCANVAS MENU ===== */
    .offcanvas {
      background: url("backmenu.jpeg") no-repeat center center;
      background-size: cover;
    }
    .offcanvas-body a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      display: block;
      margin-bottom: 12px;
      transition: 0.3s;
    }
    .offcanvas-body a:hover {
  color: #ffffff !important;
  text-shadow:
      0 0 8px #ffb7ff,
      0 0 14px #ff8cff,
      0 0 20px #ff58ff;
  transform: scale(1.06);
}

    /* ===== GLASS CONTACT CARD ===== */
    .contact-card {
      background: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px;
      max-width: 700px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(255,182,255,0.3);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
    }

    h2 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(90deg, #f8f6f8, #ffc8f8);
      -webkit-background-clip: text;
      color: transparent;
      margin-bottom: 20px;
      text-shadow: 0 0 12px rgba(255,255,255,0.3);
    }

    .form-label {
      color: #fcfafc;
      font-weight: 600;
    }

    .form-control {
      background: rgba(255,255,255,0.4);
      border: none;
      border-radius: 12px;
      color: #fff;
    }

    .btn-send {
      background: #ff66d3;
      border: none;
      color: white;
      padding: 10px 22px;
      border-radius: 12px;
      transition: 0.3s;
      font-weight: 600;
    }
    .btn-send:hover {
      background: #cc0faa;
    }

    .contact-info {
      margin-top: 30px;
      color: #fffeff;
      font-size: 1.1rem;
    }
    .contact-info i {
      margin-right: 10px;
      color: #fffdff;
    }
    body {
  font-family: "Poppins", sans-serif;
  background-image: url("download (1).jpeg");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  margin: 0;
  padding: 0;
}

.overlay {
  background: rgba(0,0,0,0.2);
}
.overlay {
  min-height: 100vh;
  padding: 120px 20px 60px;
  background: rgba(0,0,0,0.05);  /* lighter */
  backdrop-filter: blur(2px);    /* soft blur */
}

  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand ms-auto" href="#">Aditi Digital Playground</a>
    </div>
  </nav>

  <!-- BURGER BUTTON -->
  <button class="offcanvas-btn" data-bs-toggle="offcanvas" data-bs-target="#sideMenu">
    <span></span><span></span><span></span>
  </button>


  <!-- SIDE MENU -->
  <div class="offcanvas offcanvas-start text-white" id="sideMenu">
    <div class="offcanvas-header">
      <button class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <a href="Index.html">Home</a>
      <a href="Aboutme.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="qualification.html">Qualification</a>
    </div>
  </div>

  <!-- CONTACT SECTION -->
   
  <div class="overlay">
    <div class="contact-card">
      <h2>Contact for Collaboration</h2>
       
      <form id="contactForm">
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea id="message" rows="4" class="form-control" required></textarea>
        </div>

        <button class="btn btn-send">Send Message</button>
      </form>

      <div class="contact-info">
        <p><i class="bi bi-telephone-fill"></i> +91 98765 43210</p>
        <p><i class="bi bi-envelope-fill"></i> perfectlysweet@gmail.com</p>
        <p><i class="bi bi-geo-alt-fill"></i> Kasturba Pitampura, New Delhi</p>
      </div>
    </div>
  </div>

  <!-- BOOTSTRAP + JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- BURGER ANIMATION -->
  <script>
    const btn = document.querySelector('.offcanvas-btn');
    const canvas = document.getElementById('sideMenu');

    btn.addEventListener('click', () => btn.classList.toggle('active'));
    canvas.addEventListener('hidden.bs.offcanvas', () => btn.classList.remove('active'));
  </script>

</body>
</html>
